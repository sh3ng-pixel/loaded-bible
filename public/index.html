<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Loaded Bible — Study Companion</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#8b2e24">
<meta name="description" content="Load your paper Bible: what to highlight and why, margin notes, context, tabs and S.O.A.P.">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6efe2; --card:#fffaf0; --ink:#2a2018; --muted:#857561; --line:#e4d8c3;
  --accent:#8b2e24; --accent-ink:#fff; --gold:#b07d2a; --soft:#efe5d2;
  --hl-y:#ffe27a; --hl-g:#a8e6a3; --hl-b:#a9d0ff; --hl-p:#ffbfd0; --hl-o:#ffc98a; --hl-v:#d6c2ff; --hl-r:#ffaba1; --hl-t:#93e0d8; --hl-l:#d6f28a; --hl-n:#e3c7a2; --hl-k:#d6d6d6; --hl-m:#f5a3e6; --hl-s:#b8e4ff; --hl-c:#ffb59a; --hl-d:#f2cf63; --hl-e:#bff2d6; --hl-f:#e3d9ff; --hl-h:#a9b6e8; --hl-i:#d2d39a; --hl-j:#ffc2c2; --hl-q:#ffd9b8; --hl-u:#a6f0f5; --hl-w:#e6a8b8; --hl-z:#efe3c2;
  --serif:"Crimson Pro",Georgia,serif; --sans:Inter,system-ui,-apple-system,sans-serif;
  --navh:64px;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#17130f; --card:#221c16; --ink:#ede3d2; --muted:#a6957e; --line:#3a3028; --soft:#2c241c;
    --accent:#d0705f; --accent-ink:#1a120d; --gold:#d6a24e;
    --hl-y:#6b5a12; --hl-g:#2d5a2a; --hl-b:#244a73; --hl-p:#6e2f44; --hl-o:#704516; --hl-v:#4b3a78; --hl-r:#6e2a24; --hl-t:#1f5a55; --hl-l:#4b5a1a; --hl-n:#5a4330; --hl-k:#4a4a4a; --hl-m:#6b2860; --hl-s:#234f6b; --hl-c:#6e3526; --hl-d:#6a5418; --hl-e:#24533c; --hl-f:#463c6e; --hl-h:#283566; --hl-i:#4d4f22; --hl-j:#6b2f33; --hl-q:#6b4a2c; --hl-u:#1d5559; --hl-w:#5c2333; --hl-z:#5a5038;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 12px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.brand svg{color:var(--accent);flex:none}
.sync{margin-left:auto;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:#4a9a5a}
main{max-width:760px;margin:0 auto;padding:12px 14px 30px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.bottom button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:4px 0;max-width:110px}
nav.bottom button svg{width:23px;height:23px}
nav.bottom button.on{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
h1,h2,h3,h4{font-family:var(--serif);margin:.2em 0 .4em;line-height:1.15}
h2.sec{font-size:24px;margin:14px 2px 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 13px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
input.f,textarea.f,select.f{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;font-size:16px;outline:none}
textarea.f{min-height:90px;resize:vertical;line-height:1.45}
input.f:focus,textarea.f:focus{border-color:var(--accent)}
label.l{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 8px}
.tabgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 10px}
.tabgrid button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:64px;padding:8px 4px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:12.5px;font-weight:600;line-height:1.2;text-align:center;cursor:pointer}
.themegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.themecard{position:relative;display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.themecard.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tprev{display:block;position:relative;height:58px;border-radius:9px;background:var(--tbg);overflow:hidden;border:1px solid rgba(0,0,0,.08)}
.tprev i{position:absolute;display:block;border-radius:4px}
.tbar{left:6px;right:6px;top:6px;height:14px;background:var(--tac)}
.tl1{left:6px;right:6px;top:25px;height:12px;background:var(--tcd);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tl2{left:6px;width:55%;top:41px;height:10px;background:var(--tcd);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tdot{right:7px;top:41px;width:10px;height:10px;border-radius:50%!important;background:var(--tac)}
.tname{font-size:12.5px;font-weight:600;text-align:center}
.tcheck{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700}
.tabgrid.g4{grid-template-columns:repeat(4,1fr)}
.tabgrid button .te{font-size:22px;line-height:1}
.tabgrid button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
/* reader */
.readerbar{position:sticky;top:53px;z-index:15;background:var(--paper);display:flex;align-items:center;gap:6px;padding:6px 0 8px}
.readerbar .refbtn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--serif);font-size:20px;font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px;text-align:center}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-weight:700;flex:none}
.readerbar select{width:72px;padding:8px;border-radius:12px;font-size:14px;font-weight:600;background:var(--card)}
.scripture{font-family:var(--serif);line-height:1.62}
.chap-title{text-align:center;margin:10px 0 14px}
.chap-title .bk{display:block;font-size:.75em;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.chap-title .cn{display:block;font-size:2.6em;color:var(--accent);line-height:1}
.v{margin:0;padding:3px 6px;border-radius:6px;position:relative;cursor:pointer;transition:background .2s}
.v sup{font-family:var(--sans);font-size:.55em;font-weight:700;color:var(--accent);margin-right:4px;vertical-align:.55em}
.v.hl-y{background:var(--hl-y)}.v.hl-g{background:var(--hl-g)}.v.hl-b{background:var(--hl-b)}.v.hl-p{background:var(--hl-p)}.v.hl-o{background:var(--hl-o)}.v.hl-v{background:var(--hl-v)}
.v.sel{outline:2px dashed var(--accent);outline-offset:1px}
.v.flash{animation:vflash 7s ease-out;border-radius:8px;position:relative}
@keyframes vflash{0%{background:transparent;box-shadow:0 0 0 0 transparent}4%{background:color-mix(in srgb,var(--accent) 48%,transparent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 48%,transparent)}8%,71.4%{background:color-mix(in srgb,var(--accent) 38%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 38%,transparent)}100%{background:transparent;box-shadow:0 0 0 4px transparent}}
.v .mk{font-family:var(--sans);font-size:12px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:1px 6px;margin-left:5px;vertical-align:2px;font-weight:700}
.v .bm{color:var(--gold);font-size:.8em;margin-left:4px}
.chap-end{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:22px 0 6px}
.loadingline{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sh 1.2s infinite;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
/* selection bar */
#selbar{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom));z-index:25;display:none;padding:0 10px 8px}
#selbar.show{display:block}
.sb{max-width:740px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px 12px}
.sb .top{display:flex;align-items:center;gap:8px;font-weight:700;font-family:var(--serif);font-size:18px}
.dots{display:flex;gap:9px;margin:9px 0;align-items:center}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}
.dot.y{background:var(--hl-y)}.dot.g{background:var(--hl-g)}.dot.b{background:var(--hl-b)}.dot.p{background:var(--hl-p)}.dot.o{background:var(--hl-o)}.dot.v{background:var(--hl-v)}
.dot.x{background:var(--paper);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.sbacts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sbacts button{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:7px 2px;font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
.sbacts button b{font-size:17px;font-weight:400}
/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:50;display:none}
#sheetWrap.show{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheetx{position:sticky;top:0;float:right;width:34px;height:34px;margin:-4px -6px 0 8px;z-index:2}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-size:24px}
.bookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px;margin-bottom:10px}
.bk-btn{border:1px solid var(--line);border-left:5px solid var(--gc);background:var(--paper);border-radius:9px;padding:8px 8px;text-align:left;font-size:13.5px;font-weight:600}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.chgrid button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 0;font-weight:700}
.chgrid button.read{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.glabel{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 2px 6px;display:flex;align-items:center;gap:6px}
.glabel i{width:10px;height:10px;border-radius:3px;background:var(--gc)}
/* study output */
.out{font-size:16px;line-height:1.55}
.out h2,.out h3,.out h4{color:var(--accent)}
.out h2{font-size:23px}.out h3{font-size:20px}.out h4{font-size:18px}
.out ul,.out ol{padding-left:22px}
.out li{margin:3px 0}
.out blockquote{border-left:3px solid var(--gold);margin:8px 0;padding:2px 12px;font-family:var(--serif);font-size:18px}
a.ref{text-decoration:none;border-bottom:1px dotted var(--accent);cursor:pointer;font-weight:600}
.toolgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tool{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:11px;text-align:left;display:flex;gap:10px;align-items:flex-start}
.tool .e{font-size:22px;line-height:1}
.tool b{display:block;font-size:14px}
.tool span{font-size:12px;color:var(--muted)}
details.guide{border:1px solid var(--line);border-radius:14px;background:var(--card);margin:8px 0;padding:0 14px}
details.guide summary{padding:13px 0;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.guide summary::after{content:"+";color:var(--muted)}
details.guide[open] summary::after{content:"–"}
details.guide .body{padding-bottom:12px;line-height:1.5;font-size:15px}
/* lists */
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin:8px 0;position:relative}
.item .h{display:flex;align-items:center;gap:8px;font-weight:700}
.item .ref{font-family:var(--serif);font-size:18px}
.item .txt{margin-top:6px;font-size:14.5px;line-height:1.45;white-space:pre-wrap}
.item .vt{font-family:var(--serif);font-size:16px;color:var(--muted);margin-top:4px}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--muted)}
.swatch{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none}
.sw-y{background:var(--hl-y)}.sw-g{background:var(--hl-g)}.sw-b{background:var(--hl-b)}.sw-p{background:var(--hl-p)}.sw-o{background:var(--hl-o)}.sw-v{background:var(--hl-v)}
/* loaded bible: book tabs */
.edge{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.btab{position:relative;border:0;border-radius:12px 12px 12px 4px;background:var(--gc);color:#fff;padding:10px 11px 12px;text-align:left;overflow:hidden;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.btab .ab{font-size:11px;font-weight:700;letter-spacing:.1em;opacity:.8}
.btab .nm{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.1;display:block;margin-top:1px}
.btab .pg{position:absolute;left:0;bottom:0;height:4px;background:rgba(255,255,255,.85)}
.btab .ct{font-size:11px;opacity:.85}
.topic{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:9px 0;overflow:hidden}
.topic>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.topic>summary .ic{width:36px;height:36px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:18px}
.topic>summary b{font-family:var(--serif);font-size:19px}
.topic .refs{padding:0 14px 12px}
.refrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line)}
.insert{background:repeating-linear-gradient(var(--card),var(--card) 27px,var(--line) 28px);border:1px solid var(--line);border-left:6px solid var(--gc,var(--gold));border-radius:6px 14px 14px 6px;padding:12px 14px;margin:10px 0;box-shadow:0 2px 0 var(--line)}
.insert h4{font-size:21px;margin:0}
.insert .b{white-space:pre-wrap;font-family:var(--serif);font-size:17px;line-height:28px;margin-top:4px}
.prog{height:8px;border-radius:5px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.step{display:flex;gap:12px;align-items:flex-start;margin:6px 0}
.step.done{opacity:.6}
.step.done .stxt{text-decoration:line-through;text-decoration-color:var(--muted)}
.step.done .stxt .hand{text-decoration:line-through}
.stepacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mini{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}
.mini.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mini:disabled{opacity:.6}
.subpanel{margin-top:8px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.subpanel .out{font-size:14.5px}
.subpanel .out h2{font-size:18px}.subpanel .out h3,.subpanel .out h4{font-size:16px}
.grpacts{gap:6px;margin:4px 0 10px}
.tick{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--accent);background:var(--card);color:var(--accent-ink);font-weight:800;font-size:16px;margin-top:1px}
.step.done .tick{background:var(--accent)}
.hand.sticky{font-size:20px;line-height:1.5;color:#3a3010;background:#fff2a8;border-radius:3px;padding:14px 14px 16px;box-shadow:0 4px 10px rgba(0,0,0,.12);transform:rotate(-.6deg);margin:8px 2px}
.hand.half{font-size:19px;line-height:1.65;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;margin:8px 0}
.readall{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;font-size:13.5px;padding:6px 0 0;cursor:pointer}
.jfull{margin-top:6px}.jf{margin-top:8px}.jfl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}.jfb{font-family:var(--serif);font-size:16.5px;line-height:1.55;white-space:normal}
.hand{display:block;font-family:var(--serif);font-style:italic;font-size:18px;color:var(--accent);background:var(--soft);border-radius:8px;padding:4px 9px;margin-top:4px}
:root[data-theme=light]{
  --paper:#f6efe2; --card:#fffaf0; --ink:#2a2018; --muted:#857561; --line:#e4d8c3;
  --accent:#8b2e24; --accent-ink:#fff; --gold:#b07d2a; --soft:#efe5d2;
  --hl-y:#ffe27a; --hl-g:#a8e6a3; --hl-b:#a9d0ff; --hl-p:#ffbfd0; --hl-o:#ffc98a; --hl-v:#d6c2ff; --hl-r:#ffaba1; --hl-t:#93e0d8; --hl-l:#d6f28a; --hl-n:#e3c7a2; --hl-k:#d6d6d6; --hl-m:#f5a3e6; --hl-s:#b8e4ff; --hl-c:#ffb59a; --hl-d:#f2cf63; --hl-e:#bff2d6; --hl-f:#e3d9ff; --hl-h:#a9b6e8; --hl-i:#d2d39a; --hl-j:#ffc2c2; --hl-q:#ffd9b8; --hl-u:#a6f0f5; --hl-w:#e6a8b8; --hl-z:#efe3c2;
  --serif:"Crimson Pro",Georgia,serif; --sans:Inter,system-ui,-apple-system,sans-serif;
  --navh:64px;
}
:root[data-theme=dark]{--paper:#17130f; --card:#221c16; --ink:#ede3d2; --muted:#a6957e; --line:#3a3028; --soft:#2c241c;
    --accent:#d0705f; --accent-ink:#1a120d; --gold:#d6a24e;

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;opacity:.55}

.badge span{font-size:28px;display:block}.badge b{display:block;font-size:12.5px;margin-top:3px}.badge small{display:block;font-size:10.5px;color:var(--muted);line-height:1.25;margin-top:2px}

.btn.wide{width:100%;justify-content:center;margin-top:10px;padding:12px;font-size:15.5px;text-decoration:none}

.authbox{max-width:400px;margin:4vh auto 0}

details.grp{margin:8px 0}

  loadLocal(){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(this.LS))this.items.set(k.slice(this.LS.length),JSON.parse(localStorage.getItem(k)))}}catch(e){}},
  get(k){return this.items.get(k)},

  set(k,v){if(/^(k|i|p)_/.test(k)&&v&&typeof v==='object'&&!Array.isArray(v)&&!this.items.has(k)&&!('proj' in v)){const pj=curProj();if(pj)v=Object.assign({},v,{proj:pj})}this.items.set(k,v);this.persist(k,v);if(/^(n|h|b|j|t|i)_/.test(k)||k==='progress')touch();changed()},
  del(k){this.items.delete(k);this.persist(k,null);changed()},
  persist(k,v){try{v==null?localStorage.removeItem(this.LS+k):localStorage.setItem(this.LS+k,JSON.stringify(v))}catch(e){}
    this.markDirty(k,true);if(!this.col)return;clearTimeout(this.timers.get(k));
    this.timers.set(k,setTimeout(()=>{this.timers.delete(k);this.send(k)},350))},

  dkey(){return 'lb1:dirty:'+this.LS},
  loadDirty(){try{this.dirty=new Set(JSON.parse(localStorage.getItem(this.dkey())||'[]'))}catch(e){this.dirty=new Set()}this.dirtyNs=this.LS},

      ks.forEach(k=>{try{const key=k.slice(g.length);if(!this.items.has(key)&&key!=='settings'){const v=JSON.parse(localStorage.getItem(k));this.items.set(key,v);localStorage.setItem(this.LS+key,JSON.stringify(v));moved++}localStorage.removeItem(k)}catch(e){}})}

/* ---------- KJV text (public domain, loaded from an npm data package) ---------- */
let KJV=null,kjvP=null,kjvFailed=false;
function loadKJV(){if(kjvP)return kjvP;
  kjvP=(async()=>{const srcs=[
      ['https://unpkg.com/es-kjv',m=>m.verses||(m.default&&m.default.verses)],
      ['https://cdn.jsdelivr.net/npm/es-kjv/+esm',m=>m.verses||(m.default&&m.default.verses)],
      ['https://cdn.jsdelivr.net/npm/kjv@1.0.0/json/verses-1769.json/+esm',m=>m.default||m]];
    for(const [u,pick] of srcs){try{const m=await withTimeout(import(u),60000);const v=pick(m);
      if(v&&typeof v==='object'&&Object.keys(v).length>20000){KJV=buildKJV(v);return KJV}}catch(e){console.warn('KJV source failed',u,e)}}
    kjvFailed=true;return null})();
  return kjvP}
function buildKJV(v){const idx={},order=[];
  for(const k in v){const m=k.match(/^(.+?)\s+(\d+):(\d+)$/);if(!m)continue;let bi=order.indexOf(m[1]);if(bi<0){order.push(m[1]);bi=order.length-1}
    const b=BOOKS[bi];if(!b)continue;const c=+m[2],n=+m[3];const bk=idx[b.abbr]||(idx[b.abbr]={});(bk[c]||(bk[c]=[]))[n-1]=String(v[k]).replace(/^\s*#\s*/,'').trim()}
  return idx}
const plainV=t=>String(t||'').replace(/[\[\]]/g,'');
const italV=t=>esc(t).replace(/\[([^\]]+)\]/g,'<i>$1</i>');

async function loadChapter(allowFetch){if(TTS.on&&TTS.kind==='chapter')ttsStop();
  const s=settings();const key=chKey();S.chErr='';S.sel.clear();S.vIt=null;
  if(S.ctrl){S.ctrl.abort();S.ctrl=null}
  if(s.trans==='KJV'&&!kjvFailed){
    if(!KJV){S.verses=null;S.loadingCh=true;S.loadMsg='Loading the King James Bible… (first time only, about 5 MB)';renderVerses();await loadKJV();S.loadMsg=''}
    if(chKey()!==key)return;
    const raw=KJV&&KJV[s.book]&&KJV[s.book][s.ch];
    if(raw&&raw.length){for(let i=0;i<raw.length;i++)if(raw[i]==null)raw[i]='';S.vIt=raw;S.verses=raw.map(plainV);S.loadingCh=false;renderVerses();renderSelbar();return}
  }
  const cached=await Cache.get('chapters',key);
  if(chKey()!==key)return;
  if(cached&&cached.verses){S.verses=cached.verses;S.loadingCh=false;renderVerses();renderSelbar();return}
  S.verses=null;
  if(STANDALONE&&['WEB','BBE'].includes(s.trans)){S.loadingCh=true;renderVerses();try{const bn=s.book==='SNG'?'Song of Solomon':BM[s.book].name;const r=await fetch(`/api/bible?t=${s.trans.toLowerCase()}&q=${encodeURIComponent(bn+' '+s.ch)}`);
    if(r.ok){const d=await r.json();if(chKey()!==key)return;if(d.verses&&d.verses.length){const arr=[];d.verses.forEach(([n,t])=>{arr[n-1]=String(t).replace(/\s+/g,' ').trim()});for(let i=0;i<arr.length;i++)if(arr[i]==null)arr[i]='';S.verses=arr;S.loadingCh=false;Cache.put('chapters',key,{verses:arr,at:Date.now()});renderVerses();renderSelbar();return}}}catch(e){}}
  if(!allowFetch){S.loadingCh=false;renderVerses();return}
  S.loadingCh=true;renderVerses();renderSelbar();
  const ctrl=new AbortController();S.ctrl=ctrl;const b=BM[s.book];
  const parse=txt=>{const arr=[];txt.split('\n').forEach(l=>{const m=l.replace(/\*\*/g,'').trim().match(/^\[?(?:v(?:erse)?\.?\s*)?(\d{1,3})\]?\s*[|.:)\-–]?\s+(.+)$/i)||l.trim().match(/^(\d{1,3})\|(.+)$/);if(m&&+m[1]>0&&+m[1]<200)arr[+m[1]-1]=m[2].replace(/^\|\s*/,'').trim()});return arr};
  let all=[],lastText='';
  try{
    for(let round=0;round<4;round++){
      const start=all.length+1;
      const prompt=`This is for a Bible reading app. ${TRANS[s.trans]} is in the public domain. Output the text of ${b.name} chapter ${s.ch}${start>1?`, starting at verse ${start} and continuing to the end of the chapter`:''}, every verse in order, one per line, formatted exactly as:\n<verse number>|<verse text>\nNo title, no headings, no commentary, no blank lines, no other text.`;
      const res=await ai(prompt,txt=>{if(chKey()!==key)return;const part=parse(txt);const merged=all.slice();part.forEach((t,i)=>{if(t)merged[i]=t});if(merged.length){S.verses=merged;renderVerses()}},ctrl.signal,'default');
      lastText=res.text||'';const part=parse(lastText);const before=all.length;part.forEach((t,i)=>{if(t)all[i]=t});
      if(!res.truncated||all.length===before)break;
    }
    if(chKey()!==key)return;
    for(let i=0;i<all.length;i++)if(all[i]==null)all[i]='';
    if(!all.length)throw {message:'Claude didn\u2019t send the verses back'+(lastText?` (it replied: “${lastText.slice(0,140)}”)`:'')+'. Try again, or switch to KJV.'};
    S.verses=all;Cache.put('chapters',key,{verses:all,at:Date.now()});
  }catch(e){if(chKey()!==key)return;S.chErr=aiErr(e);if(!S.verses?.length)S.verses=null}
  S.loadingCh=false;S.ctrl=null;renderVerses();renderSelbar();
}

  let passage='';const s=settings();

  const ctrl=new AbortController();S.studyCtrl=ctrl;const my=S.study;
  try{const res=await ai(prompt,t=>{if(S.study!==my)return;my.text=t;const b=$('#studyBody');if(b)b.innerHTML=md(t)},ctrl.signal,'default');
    my.text=res.text;my.loading=false;if(ck)Cache.put('studies',ck,{text:res.text,at:Date.now()});keepStudy(my)}

}

  return parts.map(p=>`${BM[p.b].name} ${p.s}${p.e>p.s?'–'+p.e:''}`).join(', ')}

/* ---------- markdown ---------- */
const NAME_ALT=[...BOOKS.map(b=>b.name),'Psalm','Song of Songs'].sort((a,b)=>b.length-a.length).map(n=>n.replace(/ /g,'\\s')).join('|');
const REF_RE=new RegExp(`(^|[^A-Za-z])(${NAME_ALT})\\s+(\\d{1,3})(?::(\\d{1,3})(?:\\s?[-–]\\s?(\\d{1,3}))?)?`,'g');
function linkRefs(s){return s.replace(REF_RE,(m,pre,n,c,v1,v2)=>{const b=findBook(n);if(!b||+c>b.chapters)return m;const code=`${b.abbr} ${c}${v1?':'+v1+(v2?'-'+v2:''):''}`;return `${pre}<a class="ref" data-act="openRef" data-ref="${code}">${m.slice(pre.length)}</a>`})}
function inline(s){s=linkRefs(esc(s));return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\w)/g,'$1<em>$2</em>').replace(/(^|\s)_([^_\n]+?)_(?=\s|[.,;:!?]|$)/g,'$1<em>$2</em>')}
function md(src){const lines=String(src||'').replace(/\r/g,'').split('\n');let h='',list=null,para=[];
  const fp=()=>{if(para.length){h+='<p>'+inline(para.join(' '))+'</p>';para=[]}},fl=()=>{if(list){h+=`</${list}>`;list=null}};
  for(const raw of lines){const l=raw.trimEnd();let m;
    if(!l.trim()){fp();fl();continue}
    if(m=l.match(/^(#{1,6})\s+(.*)/)){fp();fl();const n=Math.min(4,Math.max(2,m[1].length+1));h+=`<h${n}>${inline(m[2])}</h${n}>`;continue}
    if(m=l.match(/^\s*[-*•]\s+(.*)/)){fp();if(list!=='ul'){fl();h+='<ul>';list='ul'}h+=`<li>${inline(m[1])}</li>`;continue}
    if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){fp();if(list!=='ol'){fl();h+='<ol>';list='ol'}h+=`<li>${inline(m[1])}</li>`;continue}
    if(m=l.match(/^>\s?(.*)/)){fp();fl();h+=`<blockquote>${inline(m[1])}</blockquote>`;continue}
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){fp();fl();h+='<hr>';continue}
    fl();para.push(l.trim())}
  fp();fl();return h}
const plain=src=>String(src||'').replace(/^#+\s*/gm,'').replace(/\*\*(.+?)\*\*/g,'$1').replace(/\*(.+?)\*/g,'$1');

const sw=c=>`<span class="swatch sw-${ck(c)}" style="vertical-align:-2px"></span>`;
const SHORT={Genesis:'Gen',Exodus:'Ex',Leviticus:'Lev',Numbers:'Num',Deuteronomy:'Deut',Joshua:'Josh',Judges:'Judg',Samuel:'Sam',Kings:'Kgs',Chronicles:'Chr',Nehemiah:'Neh',Esther:'Est',Psalms:'Ps',Proverbs:'Prov',Ecclesiastes:'Eccl','Song of Solomon':'Song',Isaiah:'Isa',Jeremiah:'Jer',Lamentations:'Lam',Ezekiel:'Ezek',Daniel:'Dan',Hosea:'Hos',Obadiah:'Obad',Micah:'Mic',Nahum:'Nah',Habakkuk:'Hab',Zephaniah:'Zeph',Haggai:'Hag',Zechariah:'Zech',Malachi:'Mal',Matthew:'Mt',Mark:'Mk',Luke:'Lk',John:'Jn',Romans:'Rom',Corinthians:'Cor',Galatians:'Gal',Ephesians:'Eph',Philippians:'Phil',Colossians:'Col',Thessalonians:'Thess',Timothy:'Tim',Titus:'Tit',Philemon:'Phlm',Hebrews:'Heb',James:'Jas',Peter:'Pet',Jude:'Jude',Revelation:'Rev'};
const shortRef=r=>{const p=parseRef(r);if(!p)return r;const m=BM[p.b].name.match(/^(\d )?(.+)$/);return `${m[1]?m[1].trim():''}${SHORT[m[2]]||m[2]} ${p.c}${p.v1?':'+p.v1+(p.v2?'-'+p.v2:''):''}`};

/* Turn a generated plan into a checklist of things to do in the paper Bible */
function planItems(pl){const d=pl.data||{},items=[];const add=(group,id,html,text)=>items.push({group,id,html,text});
  if(pl.kind==='chapter'){const b=pl.b,c=pl.c,nm=`${BM[b].name} ${c}`;const vr=v=>refA(`${b} ${c}:${v}`,'v. '+v);
    if(d.context){const x=d.context;
      add(pl.v1?'✍️ Above the verses':'✍️ Top of the chapter','top',`Write above ${pl.v1?'verse '+pl.v1:'chapter '+c}: <b>“${esc(x.heading||'')}”</b>${x.summary?`<div class="small muted">Optional one-liner: ${esc(x.summary)}</div>`:''}`,`Top of ${nm}: "${x.heading}"`);
      add(pl.v1?'✍️ Above the verses':'✍️ Top of the chapter','ctx',`Write a small context box by verse ${pl.v1||1}: <b>${[x.author&&'By '+x.author,x.audience&&'to '+x.audience].filter(Boolean).map(esc).join(' ')}</b>${x.setting?` · ${esc(x.setting)}`:''}${(x.background||[]).length?`<ul class="small" style="margin:6px 0 0">${x.background.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}`,`Context box by v.1: ${[x.author&&'By '+x.author,x.audience&&'to '+x.audience,x.setting].filter(Boolean).join(' · ')}`)}
    (d.highlights||[]).forEach((x,i)=>add('🖍 Highlight','hl'+i,`${sw(x.color)} Highlight ${vr(x.v)} in <b>${colorWord(x.color)}</b> <span class="small muted">(${esc(colorLabel(okColor(x.color)))})</span>${x.quote?`<div style="font-family:var(--serif);font-size:16.5px">“${esc(x.quote)}”</div>`:''}<div class="small">${esc(x.why||'')}</div>`,`Highlight v.${x.v} ${colorWord(x.color)} — ${x.why||''}`));
    (d.margin||[]).forEach((x,i)=>{const z=(pl.sizes||{})['mg'+i]||pl.size||'margin',W=NWHERE[z];add('✎ Write your notes','mg'+i,`${W[1]} ${vr(x.v)} ${W[2]}:${noteHtml(x.note,z)}${noteSizeMini('noteSizeL',pl.key,'mg'+i,z)}`,`Note v.${x.v}: ${x.note}`)});
    (d.xrefs||[]).forEach((x,i)=>add('🔗 Cross-references','xr'+i,`Next to ${vr(x.v)} write: <span class="hand" style="display:inline">${(x.refs||[]).map(y=>esc(y.ref)).join('; ')}</span><div class="small muted">${(x.refs||[]).map(y=>{const p=parseRef(y.ref);return (p?refA(rc(p),y.ref):esc(y.ref))+' — '+esc(y.why||'')}).join('<br>')}</div>`,`v.${x.v} → ${(x.refs||[]).map(y=>y.ref).join('; ')}`));
    (d.words||[]).forEach((x,i)=>add('🔤 Word meanings','wd'+i,`Above <b>“${esc(x.word)}”</b> in ${vr(x.v)} write: <span class="hand" style="display:inline">${esc(x.original||'')} = ${esc(x.meaning||'')}</span>`,`v.${x.v} "${x.word}": ${x.original} = ${x.meaning}`));
    if(d.soap){const x=d.soap;add('📖 S.O.A.P. for your journal','soap',`Copy this into your paper journal (or save it to the app Journal):<p style="margin:6px 0"><b>S</b> ${vr(x.v)} — <span style="font-family:var(--serif)">${esc(x.scripture||'')}</span></p><p style="margin:6px 0"><b>O</b> ${esc(x.observation||'')}</p><p style="margin:6px 0"><b>A</b> ${esc(x.application||'')}</p><p style="margin:6px 0"><b>P</b> <i>${esc(x.prayer||'')}</i></p><button class="btn sm" data-act="bSoap">Save to app Journal</button>`,`S.O.A.P. on v.${x.v}\nS: ${x.scripture}\nO: ${x.observation}\nA: ${x.application}\nP: ${x.prayer}`)}
  }else if(pl.kind==='topic'){const vs=(d.verses||[]).filter(x=>parseRef(x.ref));const col=d.color;const title=`${d.title||pl.topic} ${d.emoji||''}`.trim();
    if(vs[0])add('🏷️ Make the tab','tab',`Put a sticky tab on the page of ${refA(rc(parseRef(vs[0].ref)),vs[0].ref)} and write on it: <b>${esc(title)}</b>`,`Tab at ${vs[0].ref}: "${title}"`);
    vs.forEach((x,i)=>{const nx=vs[i+1];add('🖍 Highlight & link the verses','tv'+i,`${sw(col)} Highlight ${refA(rc(parseRef(x.ref)),x.ref)} in <b>${colorWord(col)}</b>${x.quote?`<div style="font-family:var(--serif);font-size:16.5px">“${esc(x.quote)}”</div>`:''}<div class="small"><b>Why:</b> ${esc(x.why||'')}${x.use?`<br><b>When:</b> ${esc(x.use)}`:''}</div>
      <div class="small" style="margin-top:4px">Then write in the margin: <span class="hand" style="display:inline">${esc(title)} → ${nx?esc(shortRef(nx.ref)):'back to '+esc(shortRef(vs[0].ref))}</span></div>`,`Highlight ${x.ref} ${colorWord(col)}; margin: "${title} → ${nx?nx.ref:'back to '+vs[0].ref}"`)});
    add('🗂️ Index it','index',`Write the list on your Bible's inside cover or an insert card: <span class="hand" style="display:inline">${esc(title)}: ${vs.map(x=>esc(shortRef(x.ref))).join(', ')}</span><div class="row" style="margin-top:6px"><button class="btn sm" data-act="bTopicIns">Save as insert card</button></div>`,`Inside cover: ${title}: ${vs.map(x=>x.ref).join(', ')}`);
  }else{const b=BM[pl.b];
    add('📑 Book tab','btab',`Put a book tab on the first page of <b>${esc(b.name)}</b>${S.tabColors?'':''} — tip: use <b>${GENRES[b.genre][0]}</b> color <span class="swatch" style="background:${GENRES[b.genre][1]};vertical-align:-2px"></span> for all ${esc(GENRES[b.genre][0])} books.`,`Book tab on ${b.name}`);
    add('✍️ Book title page','intro',`On the blank space before chapter 1 write:<div class="hand">${esc(d.tagline||'')}${(d.themes||[]).length?'<br>Themes: '+d.themes.map(esc).join(', '):''}</div>`,`${b.name} intro: ${d.tagline} Themes: ${(d.themes||[]).join(', ')}`);
    (d.key_verses||[]).forEach((x,i)=>{const p=parseRef(x.ref);add('🖍 Key verses','kv'+i,`${sw('y')} Highlight ${p?refA(rc(p),x.ref):esc(x.ref)} <span class="small muted">— ${esc(x.why||'')}</span>`,`Highlight ${x.ref} — ${x.why||''}`)});
    (d.chapters||[]).forEach(x=>add('✍️ Chapter headings','ch'+x.c,`Above chapter ${refA(`${b.abbr} ${x.c}`,String(x.c))} write <b>“${esc(x.title||'')}”</b> <span class="small muted">${esc(x.summary||'')}</span>`,`Ch ${x.c}: ${x.title}`));
  }
  return items}

function loadPlans(){return Store.list('k_').filter(inProj).sort((a,b)=>(b.at||0)-(a.at||0))}
function planTitle(pl){return pl.kind==='chapter'?`${BM[pl.b].name} ${pl.c}${pl.v1?':'+pl.v1+(pl.v2&&pl.v2>pl.v1?'-'+pl.v2:''):''}`:pl.kind==='topic'?`${(pl.data&&pl.data.emoji)||'💭'} ${(pl.data&&pl.data.title)||pl.topic}`:`📚 ${BM[pl.b].name} (whole book)`}

const LOAD_MODES=[['chapter','📖','A chapter','Step by step'],['verses','📌','Verses','One or a few'],['topic','💭','Feeling or topic','Verses that help'],['book','📚','Whole book','Set up a book'],['snote','📝','Study note','Easy explanation'],['life','🌱','Life application','Live it out'],['inserts','🗂️','Inserts','Cards to tuck in']];
const LOAD_HELP={chapter:'Pick a chapter and what you want to add. You get step-by-step what to highlight, write and tab in your paper Bible. Tick off each step. It also goes into your Online Bible.',verses:'Same as a chapter, but just for one verse or a few verses.',topic:'Pick a feeling or topic. You get verses to highlight, where to put a tab, and a chain to write in your margins. Saved to Bible Kit › Topics.',book:'Get a heading for each chapter, what to write on the book’s first page, key verses and where to put the book tab.',snote:'A short note in easy words that explains a passage. Write it in your margin, on a sticky note or on an insert. Saved to Online Bible › My notes.',life:'Turn a passage into something for your own life: what it means for you and one thing to do this week. Saved to My notes or your Journal.',inserts:'Make cards and pages to tuck into your Bible. Saved ones go to Bible Kit › Tabs › Inserts.'};
const LAPP_AREAS=[['family','👨‍👩‍👧 Family'],['friends','🤝 Friends'],['school','🎒 School or work'],['feelings','💭 Feelings'],['faith','🔥 My faith'],['money','💰 Money'],['habits','⏰ Habits'],['love','❤️ Relationships'],['church','⛪ Church']];
function lappForm(){const N=S.lapp||(S.lapp={v1:'',v2:'',areas:[],situ:'',size:'card',out:'',busy:false});const B=S.build;
  return `<div class="row" style="align-items:flex-end"><div class="grow"><label class="l">Book</label><select class="f" id="bBook">${BOOKS.map(b=>`<option value="${b.abbr}" ${b.abbr===B.book?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div><div><label class="l">Chapter</label><select class="f" id="bCh" style="width:90px">${Array.from({length:BM[B.book].chapters},(_,i)=>`<option ${i+1===B.ch?'selected':''}>${i+1}</option>`).join('')}</select></div></div>
   <div class="row" style="align-items:flex-end"><div><label class="l">From verse</label><input class="f" id="laV1" type="number" inputmode="numeric" min="1" placeholder="all" value="${esc(N.v1)}" style="width:110px"></div><div><label class="l">To verse</label><input class="f" id="laV2" type="number" inputmode="numeric" min="1" placeholder="all" value="${esc(N.v2)}" style="width:110px"></div></div>
   <label class="l">Which part of your life? (optional)</label><div class="chips">${LAPP_AREAS.map(([k,l])=>`<button class="chip ${N.areas.includes(k)?'on':''}" data-act="laArea" data-k="${k}">${l}</button>`).join('')}</div>
   <label class="l">What’s going on? (optional)</label><textarea class="f" id="laSitu" style="min-height:60px" placeholder="e.g. I find it hard to forgive my brother">${esc(N.situ)}</textarea>
   <label class="l">How big?</label><div class="chips">${SN_SIZES.map(([k,l,d])=>`<button class="chip ${N.size===k?'on':''}" data-act="laSize" data-k="${k}">${l} <span class="muted small">· ${d}</span></button>`).join('')}</div>
   <button class="btn pri" style="width:100%;justify-content:center;margin-top:8px" data-act="laGo" ${N.busy?'disabled':''}>${N.busy?'<span class="spin"></span> Writing…':'🌱 Show me how to live it'}</button>
   ${N.out||N.busy?`<div class="snotecard"><div class="small muted" style="margin-bottom:4px">🌱 ${esc(laRefLabel())}</div><div id="laOut" class="out">${md(N.out)}</div>
     ${N.out&&!N.busy?`<div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn sm pri grow" data-act="laSave">💾 My notes</button><button class="btn sm grow" data-act="laJournal">📓 Journal</button><button class="iconbtn" data-act="laGo" title="New one">🔁</button><button class="iconbtn" data-act="printLapp" title="Print">🖨️</button><button class="iconbtn" data-act="laCopy" title="Copy">⧉</button><button class="iconbtn" data-act="laDiscard" title="Throw away">🗑</button></div>`:''}</div>`:''}`}
function laRefLabel(){const B=S.build,N=S.lapp;const a=parseInt(N.v1)||0,b=Math.max(parseInt(N.v2)||a,a);return `${BM[B.book].name} ${B.ch}${a?':'+a+(b>a?'–'+b:''):''}`}
function bindLapp(v){const N=S.lapp;[['laV1','v1'],['laV2','v2'],['laSitu','situ']].forEach(([id,k])=>{const i=$('#'+id,v);if(i)i.oninput=()=>{N[k]=i.value}})}
const SN_KINDS=[['sum','📝 Summary','What happens, in short'],['explain','💡 Explanation','What it means, made simple'],['life','🌱 For my life','What it means for me today'],['all','✨ All three','Summary, meaning and life']];
const SN_SIZES=[['margin','✎ Margin','2–3 short lines'],['card','🗒️ Sticky note','A small card'],['page','📄 Half page','An insert page']];
function snoteForm(){const N=S.snote||(S.snote={kind:'all',size:'card',v1:'',v2:'',out:'',busy:false});const B=S.build;
  return `<p class="small muted" style="margin:6px 2px 0">A clear note in easy words that you can write in your Bible, on a sticky note or on an insert page.</p>
   <div class="row" style="align-items:flex-end"><div class="grow"><label class="l">Book</label><select class="f" id="bBook">${BOOKS.map(b=>`<option value="${b.abbr}" ${b.abbr===B.book?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div><div><label class="l">Chapter</label><select class="f" id="bCh" style="width:90px">${Array.from({length:BM[B.book].chapters},(_,i)=>`<option ${i+1===B.ch?'selected':''}>${i+1}</option>`).join('')}</select></div></div>
   <div class="row" style="align-items:flex-end"><div><label class="l">From verse</label><input class="f" id="snV1" type="number" inputmode="numeric" min="1" placeholder="all" value="${esc(N.v1)}" style="width:110px"></div><div><label class="l">To verse</label><input class="f" id="snV2" type="number" inputmode="numeric" min="1" placeholder="all" value="${esc(N.v2)}" style="width:110px"></div></div>
   <p class="small muted" style="margin:4px 2px 0">Leave the verses empty for the whole chapter.</p>
   <label class="l">What kind of note?</label><div class="chips">${SN_KINDS.map(([k,l])=>`<button class="chip ${N.kind===k?'on':''}" data-act="snKind" data-k="${k}">${l}</button>`).join('')}</div>
   <label class="l">How big?</label><div class="chips">${SN_SIZES.map(([k,l,d])=>`<button class="chip ${N.size===k?'on':''}" data-act="snSize" data-k="${k}">${l} <span class="muted small">· ${d}</span></button>`).join('')}</div>
   <button class="btn pri" style="width:100%;justify-content:center;margin-top:8px" data-act="snGo" ${N.busy?'disabled':''}>${N.busy?'<span class="spin"></span> Writing your note…':'✨ Write my study note'}</button>
   ${N.out||N.busy?`<div class="snotecard"><div class="small muted" style="margin-bottom:4px">📝 ${esc(snRefLabel())}</div><div id="snOut" class="out">${md(N.out)}</div>
     ${N.out&&!N.busy?`<div class="row" style="margin-top:10px"><button class="btn sm pri grow" data-act="snSave">💾 Save to my notes</button><button class="btn sm grow" data-act="snGo">🔁 New one</button><button class="iconbtn" data-act="printSnote" title="Print">🖨️</button><button class="iconbtn" data-act="snCopy" title="Copy">⧉</button><button class="iconbtn" data-act="snDiscard" title="Throw away">🗑</button></div>`:''}</div>`:''}`}
function snRefLabel(){const B=S.build,N=S.snote;const a=parseInt(N.v1)||0,b=Math.max(parseInt(N.v2)||a,a);return `${BM[B.book].name} ${B.ch}${a?':'+a+(b>a?'–'+b:''):''}`}
function bindSnote(v){const N=S.snote;[['snV1','v1'],['snV2','v2']].forEach(([id,k])=>{const i=$('#'+id,v);if(i)i.oninput=()=>{N[k]=i.value}})}
function viewLoad(v){const B=S.build;const s=settings();if(!B.book){B.book=s.book;B.ch=s.ch}if(!B.bookOnly)B.bookOnly=s.book;
  const bookOpts=sel=>BOOKS.map(b=>`<option value="${b.abbr}" ${b.abbr===sel?'selected':''}>${esc(b.name)}</option>`).join('');
  let form='';
  if(B.mode==='chapter')form=`<div class="row" style="align-items:flex-end"><div class="grow"><label class="l">Book</label><select class="f" id="bBook">${bookOpts(B.book)}</select></div><div><label class="l">Chapter</label><select class="f" id="bCh" style="width:90px">${Array.from({length:BM[B.book].chapters},(_,i)=>`<option ${i+1===B.ch?'selected':''}>${i+1}</option>`).join('')}</select></div></div>
    ${partsHtml(B)}
    <button class="btn pri" style="width:100%;justify-content:center;margin-top:6px" data-act="bGo">✨ Show me how to load ${esc(BM[B.book].name)} ${B.ch}</button>`;
  else if(B.mode==='verses'){const v1=B.v1||1,v2=Math.max(B.v2||v1,v1);form=`<div class="row" style="align-items:flex-end"><div class="grow"><label class="l">Book</label><select class="f" id="bBook">${bookOpts(B.book)}</select></div><div><label class="l">Chapter</label><select class="f" id="bCh" style="width:90px">${Array.from({length:BM[B.book].chapters},(_,i)=>`<option ${i+1===B.ch?'selected':''}>${i+1}</option>`).join('')}</select></div></div>
    <div class="row" style="align-items:flex-end"><div><label class="l">From verse</label><input class="f" id="bV1" type="number" inputmode="numeric" min="1" max="176" value="${v1}" style="width:110px"></div><div><label class="l">To verse</label><input class="f" id="bV2" type="number" inputmode="numeric" min="1" max="176" value="${v2}" style="width:110px"></div></div>
    <p class="small muted" style="margin:6px 2px 0">For one verse, use the same number twice.</p>
    <div class="vpreview" id="vPrev">You're loading <b>${esc(BM[B.book].name)} ${B.ch}:${v1}${v2>v1?'–'+v2:''}</b></div>
    ${partsHtml(B)}
    <button class="btn pri" style="width:100%;justify-content:center;margin-top:6px" data-act="bGo">✨ Show me how to load ${esc(BM[B.book].name)} ${B.ch}:${v1}${v2>v1?'-'+v2:''}</button>`}
  else if(B.mode==='inserts')form=insertForm();
  else if(B.mode==='snote')form=snoteForm();
  else if(B.mode==='life')form=lappForm();

    <input class="f" id="bTopic" value="${esc(B.topic)}" placeholder="e.g. sadness, fear, my new job, patience">
    <div class="chips" style="flex-wrap:wrap;margin-top:6px">${FEELINGS.map(f=>`<button class="chip ${B.topic===f?'on':''}" data-act="bFeel" data-f="${esc(f)}">${esc(f)}</button>`).join('')}</div>
    <button class="btn pri" style="width:100%;justify-content:center;margin-top:6px" data-act="bGo">✨ Find verses${B.topic?' for '+esc(B.topic.toLowerCase()):''}</button>
    <p class="small muted">You'll get verses to highlight (with why), where to put a tab, and a chain to write in the margins so you can flip from one verse to the next.</p>`;
  else form=`<label class="l">Which book?</label><select class="f" id="bBookOnly">${bookOpts(B.bookOnly)}</select>

    <button class="btn pri" style="width:100%;justify-content:center" data-act="bGo">✨ Show me how to load ${esc(BM[B.bookOnly].name)}</button>`;
  const plans=loadPlans();

  if(B.mode==='life'){setTimeout(()=>bindLapp(v),0)}
  v.innerHTML=`${projBar()}<div class="hero"><h2>Load your Bible</h2><p>Grab your Bible, a highlighter and a fine pen. Pick what to load and get a step-by-step to-do list.</p></div>
  <div class="card">

    <div class="modegrid">${LOAD_MODES.map(([k,e,l,d])=>`<button class="modecard ${B.mode===k?'on':''}" data-act="bMode" data-m="${k}"><span class="me">${e}</span><b>${l}</b><small>${d}</small></button>`).join('')}</div>

  const bb=$('#bBook',v);if(bb)bb.onchange=()=>{B.book=bb.value;B.ch=1;renderView()};

function archivePlan(pl){const pp=planProg(pl);const st=Object.assign({},Store.get('stats')||{});const ar=Object.assign({loaded:0,topics:0,books:0,psalms:0,steps:0},st.arch||{});
  ar.steps+=pp.dn;if(pp.done){if(pl.kind==='chapter'){ar.loaded++;if(pl.b==='PSA')ar.psalms++}else if(pl.kind==='topic')ar.topics++;else ar.books++}st.arch=ar;Store.set('stats',st)}

async function runBuild(){const B=S.build;if(B.mode==='inserts')return runInsert();const s=settings();let prompt,meta,key;
  if(B.mode==='chapter'||B.mode==='verses'){if(isSimple())B.parts={context:true,hl:true,margin:true,xrefs:false,words:false,soap:false};const parts=Object.keys(B.parts).filter(k=>B.parts[k]);if(!parts.length){toast('Pick at least one thing to add');return}
    const isV=B.mode==='verses';const v1=B.v1||1,v2=Math.max(B.v2||v1,v1);const name=`${BM[B.book].name} ${B.ch}${isV?':'+v1+(v2>v1?'-'+v2:''):''}`;const keys=[];
    if(B.parts.context)keys.push('"context": {"heading": "short title to write above the chapter (max 6 words)", "summary": "one-line summary (max 15 words)", "author": "", "audience": "who it was first written to (few words)", "setting": "when/where and what is happening (max 15 words)", "background": ["2-4 short historical or cultural facts a modern reader would miss (max 15 words each)"]}');
    if(B.parts.hl)keys.push(`"highlights": [{"v": "verse number or range like 3-5", "color": "one color code from the color key", "quote": "opening words of the verse (max 10 words)", "why": "one sentence: why highlight it and why that color"}] — the 5-10 most important verses`);
    if(B.parts.margin)keys.push('"margin": [{"v": "verse number or range", "note": "margin note, max 15 words, handwritable"}] — 5-10 notes across the chapter');
    if(B.parts.xrefs)keys.push('"xrefs": [{"v": "verse number", "refs": [{"ref": "Book chapter:verse (full book name)", "why": "max 8 words"}]}] — 4-8 verses with 1-3 well-known cross-references each');
    if(B.parts.words)keys.push('"words": [{"v": "verse number", "word": "the English word as it appears", "original": "Hebrew/Greek transliterated", "meaning": "max 8 words"}] — 2-4 key words');
    if(B.parts.soap)keys.push(`"soap": {"v": "key verse number or range", "scripture": "text of that verse in the ${s.trans}", "observation": "2-3 sentences", "application": "2-3 practical, personal sentences", "prayer": "1-2 sentence prayer"}`);
    prompt=JSYS+`Show me how to load ${name} in my paper Bible (${TRANS[s.trans]}).${isV?` Only cover verses ${v1}${v2>v1?'-'+v2:''} (use fewer items if the passage is short); the context may describe the surrounding chapter.`:''}\nMy highlighter color key: ${colorKeyText()}.\nReturn a JSON object with exactly these keys:\n${keys.join(',\n')}`;
    key=isV?`k_${B.book}.${B.ch}.${v1}-${v2}`:`k_${B.book}.${B.ch}`;meta=isV?{kind:'chapter',b:B.book,c:B.ch,v1,v2}:{kind:'chapter',b:B.book,c:B.ch};}
  else if(B.mode==='topic'){const t=(B.topic||'').trim();if(!t){toast('Type or pick a feeling or topic');return}
    prompt=JSYS+`I want to make a topic tab in my paper Bible for "${t}" — verses to highlight in one color and chain together in the margins.\nMy highlighter color key: ${colorKeyText()}.\nReturn JSON: {"title": "tab label (1-2 words)", "emoji": "one emoji", "color": "best color code from my key", "intro": "2 sentences on what the Bible says about ${t}, gently and honestly", "verses": [{"ref": "Book chapter:verse or chapter:verse-verse (full book name)", "quote": "short quote from the ${s.trans}, max 15 words", "why": "1-2 sentences: why this verse speaks to ${t}, true to its context", "use": "when to turn to it (max 12 words)"}] (7-10 verses in Bible order, Old and New Testament, never ripped out of context), "prayer": "a short prayer"}`;
    key='k_t-'+t.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40);meta={kind:'topic',topic:t};}
  else{const b=BM[B.bookOnly];
    prompt=JSYS+`Show me how to load the book of ${b.name} (${b.chapters} chapters) in my paper Bible.\nReturn JSON: {"tagline": "one sentence on what the book is about (max 20 words)", "themes": ["3-5 big themes, 1-3 words each"], "key_verses": [{"ref": "Book chapter:verse (full book name)", "why": "max 12 words"}] (4-8), "chapters": [{"c": chapter number, "title": "heading to write above the chapter, max 5 words", "summary": "max 10 words"}] (one for EVERY chapter 1-${b.chapters})}`;
    key='k_b-'+b.abbr;meta={kind:'book',b:b.abbr};}
  B.loading=true;B.err='';B.prog=0;B.planKey=null;renderBuildOut();$('#buildOut')?.scrollIntoView({behavior:'smooth',block:'start'});
  try{const res=await ai(prompt,t=>{B.prog=t.length;if(B.prog%400<60)renderBuildOut()},null,'default');
    const data=parseJSON(res.text);Store.set(key,Object.assign({data,checks:{},at:Date.now()},meta));B.planKey=key;}
  catch(e){B.err=aiErr(e)}
  B.loading=false;if(S.tab==='load')renderView();if(B.planKey)scrollToPlan(B.planKey);else setTimeout(()=>$('#buildOut')?.scrollIntoView({behavior:'smooth',block:'start'}),50)}

function planOnline(pl){const d=pl.data;
  if(pl.kind==='chapter'){const b=pl.b,c=pl.c,V=v=>vrange(parseRef(`${b} ${c}:${v}`));
    if(d.context){const x=d.context;addNote(b,c,[],'Context: '+(x.heading||''),[x.author&&'Author: '+x.author,x.audience&&'Written to: '+x.audience,x.setting&&'Setting: '+x.setting,x.summary,(x.background||[]).map(t=>'• '+t).join('\n')].filter(Boolean).join('\n\n'))}
    (d.highlights||[]).forEach(x=>applyHL(b,c,V(x.v),x.color,x.quote));
    (d.margin||[]).forEach(x=>addNote(b,c,V(x.v),'Margin note',x.note));
    (d.xrefs||[]).forEach(x=>addNote(b,c,V(x.v),'Cross-references',(x.refs||[]).map(y=>`${y.ref} — ${y.why||''}`).join('\n')));
    (d.words||[]).forEach(x=>addNote(b,c,V(x.v),`Word: ${x.word} (${x.original||''})`,x.meaning||''));}
  else if(pl.kind==='topic'){const refs=(d.verses||[]).map(x=>parseRef(x.ref)).filter(Boolean);
    const tp={name:d.title||pl.topic,emoji:d.emoji||'🏷️',color:okColor(d.color),meaning:''};refs.forEach(p=>saveVerseToMainQuiet(tp,{ref:rc(p),why:''}));(d.verses||[]).forEach(x=>{const p=parseRef(x.ref);if(p&&p.v1)applyHL(p.b,p.c,vrange(p),d.color,x.quote)})}
  else{const b=BM[pl.b];Store.set('i_'+newId(),{title:`${b.name} — chapter by chapter`,ref:`${b.abbr} 1`,body:(d.tagline?d.tagline+'\n\n':'')+(d.chapters||[]).map(x=>`${x.c}. ${x.title}${x.summary?' — '+x.summary:''}`).join('\n'),updated:Date.now()});
    (d.key_verses||[]).forEach(x=>{const p=parseRef(x.ref);if(p&&p.v1)applyHL(p.b,p.c,vrange(p),'y','')})}
  toast('Done! Open 📖 Online Bible › Read to see the highlights and notes')}

async function fileToJpeg(file,w,h,maxLen){const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('That file isn\u2019t a picture I can open.'));i.src=url});
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');const sr=Math.max(w/img.naturalWidth,h/img.naturalHeight);const sw=w/sr,sh=h/sr;
  x.drawImage(img,(img.naturalWidth-sw)/2,(img.naturalHeight-sh)/2,sw,sh,0,0,w,h);let q=.86,d;do{d=c.toDataURL('image/jpeg',q);q-=.08}while(d.length>maxLen&&q>.3);return d}finally{URL.revokeObjectURL(url)}}

function computeStats(){const plans=Store.list('k_');let steps=0,loaded=0,topics=0,books=0,psL=0;
  plans.forEach(pl=>{const it=planItems(pl);const dn=it.filter(x=>(pl.checks||{})[x.id]).length;steps+=dn;if(it.length&&dn===it.length){if(pl.kind==='chapter'){loaded++;if(pl.b==='PSA')psL++}else if(pl.kind==='topic')topics++;else books++}});
  const ar=(Store.get('stats')||{}).arch||{};steps+=ar.steps||0;loaded+=ar.loaded||0;topics+=ar.topics||0;books+=ar.books||0;psL+=ar.psalms||0;
  const pr=progress();const read=Object.values(pr).reduce((a,x)=>a+x.length,0);
  const gospels=['MAT','MRK','LUK','JHN'].every(b=>(pr[b]||[]).length>=BM[b].chapters);
  const ntRead=BOOKS.filter(b=>b.nt).reduce((a,b)=>a+(pr[b.abbr]||[]).length,0);
  const hl=Store.list('h_').length,notes=Store.list('n_').length,journal=Store.list('j_').length,tabs=mainSet().topics.length,ins=Store.list('i_').length;
  const days=(Store.get('stats')||{}).days||{};let streak=0;const d=new Date();if(!days[todayStr(d)])d.setDate(d.getDate()-1);while(days[todayStr(d)]){streak++;d.setDate(d.getDate()-1)}
  const today=days[todayStr()]||0;let best=0,run=0,prev=null;Object.keys(days).sort().forEach(k=>{const dt=new Date(k+'T12:00');run=prev&&(dt-prev)<36*3600e3?run+1:1;prev=dt;best=Math.max(best,run)});
  const xp=steps*5+hl*2+notes*3+journal*10+read*5+loaded*25+topics*25+books*60+Math.min(streak,60)*5;
  return {steps,loaded,topics,books,psalms:Math.max(psL,(pr.PSA||[]).length),read,gospels,ntRead,hl,notes,journal,tabs,ins,streak,best,today,xp,activeDays:Object.keys(days).length}}
function levelOf(xp){const n=Math.floor(Math.sqrt(xp/40))+1;const lo=40*(n-1)**2,hi=40*n**2;return {n,title:LEVELS[Math.min(n-1,LEVELS.length-1)],pct:Math.round((xp-lo)/(hi-lo)*100),toNext:hi-xp}}

async function initAuth(){showAuth('loading');Store.readyResolve();
  if(!CFG.firebase||!CFG.firebase.apiKey){Auth.noFirebase=true;startGuest();toast('Accounts aren’t set up yet (see config.js) — using guest mode');return}
  try{const fb=await loadFirebase();const h=new URLSearchParams(location.hash.slice(1));
    if(h.get('tterr')){S.authNote={m:h.get('tterr')};history.replaceState(null,'',location.pathname+'#load')}
    if(h.get('tt')){const tok=h.get('tt'),nm=h.get('n'),av=h.get('a');history.replaceState(null,'',location.pathname+'#load');
      try{const c=await fb.A.signInWithCustomToken(fb.auth,tok);if(nm&&!c.user.displayName)await fb.A.updateProfile(c.user,{displayName:nm,photoURL:av||null})}catch(e){S.authNote={m:AUTH_ERR[e.code]||'TikTok sign-in failed. Please try again.'}}}
    fb.A.getRedirectResult(fb.auth).catch(e=>{S.authNote={m:AUTH_ERR[e.code]||e.message}});
    fb.A.onAuthStateChanged(fb.auth,u=>{Auth.user=u;Auth.ready=true;
      if(u){Auth.guest=false;try{localStorage.removeItem('lb1:guest')}catch(e){}hideAuth();const moved=Store.useNamespace(u.uid,true);Store.connectFire(u.uid);

      else if(isGuestFlag())startGuest();

      applyTheme();updateAvatar();renderView()});
  }catch(e){console.warn(e);Auth.noFirebase=true;startGuest();toast('Couldn’t reach the login service — using guest mode')}}
async function aiServer(prompt,onText,signal,tier){
  const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json','X-Code':Code.value||''},body:JSON.stringify({prompt,tier:tier||'default'}),signal});
  if(!r.ok){let m='The AI helper isn’t available right now.';try{const j=await r.json();m=j.error||m}catch(e){}throw {code:r.status===429?'rate_limited':'server',message:m}}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',text='',stop=null;
  for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith('data:'))continue;let ev;try{ev=JSON.parse(line.slice(5))}catch(e){continue}
      if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='text_delta'){text+=ev.delta.text;onText&&onText(text)}
      else if(ev.type==='message_delta'&&ev.delta)stop=ev.delta.stop_reason;
      else if(ev.type==='error')throw {message:(ev.error&&ev.error.message)||'The AI helper had a problem.'}}}
  return {text,truncated:stop==='max_tokens'}}

const STARTER_COLORS={salvation:'p',romansroad:'o',prayer:'b',peace:'t',forgive:'l',strength:'r',identity:'v',hope:'y',wisdom:'g',love:'p',temptation:'k',comfort:'n'};
const FOCUS_IDEAS=['General','New believers','Hard times','Teens','Families','Prayer life','Leaders','Doubts & questions'];
const vv=refs=>refs.map(r=>({ref:r,why:''}));
function defaultMain(){const labels=(Store.get('settings')||{}).labels||{};
  const topics=MAIN_DEFAULT_TOPICS.map(([id,emoji,name,color,meaning,refs])=>({id,emoji,name:labels[color]||name,color,meaning,verses:vv(refs)}));
  const used=new Set(topics.map(t=>t.color));const free=PALETTE.map(p=>p[0]).filter(c=>!used.has(c));
  Store.list('t_').filter(t=>t.key.startsWith('t_u')).forEach((t,i)=>topics.push({id:t.key.slice(2),emoji:t.ic||'🏷️',name:t.name||'Topic',color:free[i%free.length]||'y',meaning:'',verses:vv(t.refs||[])}));
  return {id:'main',name:'My main key',main:true,topics}}
function defaultStarter(){return {id:'starter',name:'Starter topics',builtin:true,topics:TOPICS.map(([id,ic,name,refs])=>({id,emoji:ic,name,color:STARTER_COLORS[id]||'y',meaning:'',verses:vv(refs)}))}}
function getSet(id){const s=Store.get(id==='main'?mainKey():'s_'+id);if(s)return Object.assign({id},s);if(id==='main')return defaultMain();if(id==='starter')return defaultStarter();return null}
const mainSet=()=>getSet('main');
function curProj(){try{const id=(Store.get('settings')||{}).proj||'';return id&&projList().some(p=>p.id===id)?id:''}catch(e){return ''}}
function projList(){return ((Store.get('projects')||{}).list)||[]}
const curProjObj=()=>projList().find(p=>p.id===curProj())||null;
const mainKey=()=>{const pj=curProj();return pj?'s_main_'+pj:'s_main'};
const inProj=x=>(x.proj||'')===curProj();
function allSets(){const st=Store.get('s_starter');const out=[mainSet()];if(!(st&&st.deleted))out.push(getSet('starter'));Store.list('s_').filter(s=>!s.key.startsWith('s_main')&&s.key!=='s_starter').sort((a,b)=>(a.at||0)-(b.at||0)).forEach(s=>out.push(Object.assign({},s,{id:s.key.slice(2)})));return out}
function updateSet(id,fn){const s=JSON.parse(JSON.stringify(getSet(id)));fn(s);delete s.key;delete s.id;Store.set(id==='main'?mainKey():'s_'+id,s);return s}
const findTopic=(s,tid)=>(s.topics||[]).find(t=>t.id===tid);
const sameName=(a,b)=>String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();
function normRef(r){const p=parseRef(r);return p?rc(p):null}
function saveVerseToMain(topic,verse){let where='';updateSet('main',m=>{let t=m.topics.find(x=>sameName(x.name,topic.name));
    if(!t){t={id:'t'+newId(),emoji:topic.emoji,name:topic.name,color:topic.color,meaning:topic.meaning||'',verses:[]};m.topics.push(t)}
    if(!t.verses.some(x=>x.ref===verse.ref))t.verses.push({ref:verse.ref,why:verse.why||''});where=t.name});
  toast(`⭐ Saved to your main key → ${where}`)}
const swBig=(c,emoji)=>`<span class="kdot sw-${ck(c)}">${esc(emoji||'')}</span>`;
function keyLegend(s){return `<div class="legend">${(s.topics||[]).map(t=>`<span class="lg"><span class="swatch sw-${ck(t.color)}"></span>${esc(t.name)}</span>`).join('')}</div>`}

function loadedKey(el){const sets=allSets();if(!sets.find(s=>s.id===S.keySet))S.keySet='main';const s=getSet(S.keySet);const isMain=s.id==='main';
  el.innerHTML=`<div class="chips settabs">${sets.map(x=>`<button class="chip ${x.id===s.id?'on':''}" data-act="keySet" data-s="${esc(x.id)}">${x.id==='main'?'⭐ ':x.id==='starter'?'🌱 ':'✨ '}${esc(x.name)}</button>`).join('')}<button class="chip addchip" data-act="keyGenerate">＋ Generate a new set</button></div>
   <div class="card keyhead ${isMain?'ismain':''}">
     <div class="row"><h3 class="grow" style="margin:0;font-size:22px">${isMain?'⭐ ':''}${esc(s.name)}</h3><span class="tag">${s.topics.length} topics</span></div>
     ${isMain?'<div class="small" style="margin-top:4px;font-weight:700;color:var(--accent)">⭐ This is your main key</div>':`<div class="row" style="margin-top:10px"><button class="btn pri grow" data-act="keyUseMain">⭐ Make this my main key</button><button class="btn danger" data-act="keyDelSet">🗑 Delete</button></div>`}
     <p class="small muted" style="margin:6px 0 8px">${isMain?'⭐ <b>Your main key.</b> Load, Study and the highlight colors in the Online Bible all use it. Open another set and tap ⭐ Make this my main key to switch. This is the key you use in your paper Bible: each topic has a highlighter color and its verses. Save verses or whole topics here from the other sets.':s.id==='starter'?'Ready-made topics to get you started. Tap ⭐ to save verses or topics into your main key.':`Generated${s.focus?' for “'+esc(s.focus)+'”':''}${s.at?' · '+new Date(s.at).toLocaleDateString(undefined,{day:'numeric',month:'short'}):''}. Compare the colors, then save what fits you with ⭐.`}</p>
     ${keyLegend(s)}
     <div class="row" style="margin-top:10px">
       <button class="btn sm pri" data-act="keyAddTopic">＋ Add topic</button>
       ${isMain?'<button class="btn sm" data-act="copyKey">📋 Copy key for my inside cover</button>':''}
       ${!isMain?'<button class="btn sm" data-act="keyRename">✏️ Rename</button>':''}
     </div></div>
   ${s.topics.length?s.topics.map(t=>topicCard(s,t)).join(''):'<div class="empty">No topics yet — tap ＋ Add topic.</div>'}
   ${isMain?'<p class="small muted">Tip: in Online Bible you can tap verses → 🏷️ to add them here.</p>':''}`;
  $$('details.topic',el).forEach(d=>d.querySelector('summary').addEventListener('click',()=>{S.openTopic=d.open?null:d.dataset.topic}))}
function topicCard(s,t){const isMain=s.id==='main';const open=S.openTopic===s.id+'|'+t.id;const busy=S.keyBusy===s.id+'|'+t.id;
  const vrow=(v,i,sugg)=>{const p=parseRef(v.ref);return `<div class="refrow" style="align-items:flex-start"><div class="grow">${p?refA(rc(p),codeToLabel(v.ref)):esc(v.ref)}${v.why?`<div class="small muted">${esc(v.why)}</div>`:''}</div>
    ${sugg?`<button class="btn sm pri" data-act="keyAddSugg" data-t="${t.id}" data-i="${i}">＋ Add</button>`:isMain?`<button class="btn sm ghost" data-act="keyDelVerse" data-t="${t.id}" data-i="${i}" aria-label="Remove">✕</button>`:`<button class="btn sm" data-act="keySaveVerse" data-t="${t.id}" data-i="${i}">⭐ Save</button>`}</div>`};
  return `<details class="topic" data-topic="${esc(s.id+'|'+t.id)}" ${open?'open':''}><summary>${swBig(t.color,t.emoji)}<div class="grow" style="min-width:0"><b>${esc(t.name)}</b><div class="small muted">${esc(colorWord(t.color))}${t.meaning?' · '+esc(t.meaning):''}</div></div><span class="tag">${(t.verses||[]).length}</span></summary>
   <div class="refs">${(t.verses||[]).map((v,i)=>vrow(v,i,false)).join('')||'<p class="small muted">No verses yet.</p>'}
   ${isMain&&(t.suggest||[]).length?`<div class="glabel" style="margin-top:12px">✨ Suggestions</div>${t.suggest.map((v,i)=>vrow(v,i,true)).join('')}`:''}
   ${isMain?`<div class="row" style="margin-top:8px"><input class="f grow" id="kadd_${t.id}" placeholder="Add a verse, e.g. Psalm 27:1"><button class="btn sm" data-act="keyAddVerse" data-t="${t.id}">Add</button></div>`:''}
   <div class="row" style="margin-top:10px"><button class="btn sm ${isMain?'':'pri'}" data-act="keyRefresh" data-t="${t.id}" ${busy?'disabled':''}>${busy?'<span class="spin"></span> Finding…':isMain?'✨ Suggest new verses':'🔄 New verses'}</button>
     ${!isMain?`<button class="btn sm" data-act="keySaveTopic" data-t="${t.id}">⭐ Save whole topic</button>`:''}
     <button class="btn sm" data-act="loadTopicPaper" data-n="${esc(t.name)}">✨ Load in my Bible</button>
     <button class="btn sm" data-act="friendTopic" data-s="${esc(s.id)}" data-t="${t.id}">🤝 Send</button>
     <button class="btn sm" data-act="keyEditTopic" data-t="${t.id}">✏️ Edit</button><button class="btn sm danger" data-act="keyDelTopic" data-t="${t.id}">🗑</button></div></div></details>`}
function topicSheet(tid){const s=getSet(S.keySet);const t=tid?findTopic(s,tid):{name:'',emoji:'🏷️',color:(PALETTE.find(p=>!s.topics.some(x=>x.color===p[0]))||PALETTE[0])[0],meaning:''};S._tColor=t.color;
  openSheet(`<h3>${tid?'Edit topic':'New topic'}</h3>
   <label class="l">Name</label><input class="f" id="tkName" value="${esc(t.name)}" placeholder="e.g. Faith, Courage, Family" maxlength="40">
   <label class="l">What this color marks (optional)</label><input class="f" id="tkMeaning" value="${esc(t.meaning||'')}" placeholder="e.g. Verses about trusting God" maxlength="80">
   <label class="l">Emoji</label><input class="f" id="tkEmoji" value="${esc(t.emoji||'')}" maxlength="4" style="width:90px">
   <label class="l">Highlighter color</label><div class="palette"><label class="pal wheel ${/^#/.test(t.color||'')?'on':''}" id="tkWheelLab" style="${/^#/.test(t.color||'')?'--pick:'+t.color:''}"><input type="color" id="tkWheel" value="${/^#/.test(t.color||'')?t.color:'#ff7a59'}"><small>🎨 Any color</small></label>${PALETTE.map(([c,n])=>`<button class="pal sw-${c} ${t.color===c?'on':''}" data-act="keyPickColor" data-c="${c}" title="${n}"><small>${n}</small></button>`).join('')}</div>
   <div class="row" style="margin-top:14px"><button class="btn pri grow" data-act="keySaveTopicForm" data-t="${tid||''}">${tid?'Save':'Add topic'}</button></div>`);
  const w=$('#tkWheel');w.addEventListener('input',()=>{S._tColor=w.value.toLowerCase();$$('.pal').forEach(b=>b.classList.remove('on'));const lab=$('#tkWheelLab');lab.classList.add('on');lab.style.setProperty('--pick',w.value)})}
function genSheet(){S.genN=S.genN||6;S.genFocus=S.genFocus||'';
  openSheet(`<h3>✨ Generate a new set</h3><p class="small muted">Get a fresh set of topics, each with a highlighter color and 5 verses. It opens as its own tab, so your main key stays safe.</p>
   <label class="l">How many topics / colors?</label>
   <div class="row stepper"><button class="iconbtn" data-act="genStep" data-d="-1">−</button><b id="genN" style="font-size:28px;min-width:44px;text-align:center">${S.genN}</b><button class="iconbtn" data-act="genStep" data-d="1">＋</button><span class="small muted">(2–25)</span></div>
   <label class="l">Focus (optional)</label><input class="f" id="genFocus" value="${esc(S.genFocus)}" placeholder="e.g. hard times, new believers, my marriage">
   <div class="chips" style="flex-wrap:wrap;margin-top:6px">${FOCUS_IDEAS.map(f=>`<button class="chip" data-act="genFocusPick" data-f="${esc(f)}">${esc(f)}</button>`).join('')}</div>
   <button class="btn pri wide" id="genGo" data-act="genGo">✨ Generate ${S.genN} topics</button><div id="genMsg" class="small muted" style="text-align:center;margin-top:8px"></div>
   ${(Store.get('s_starter')||{}).deleted?'<button class="linkbtn" data-act="keyRestoreStarter">🌱 Bring back the Starter topics tab</button>':''}`);
  $('#genFocus').addEventListener('input',e=>S.genFocus=e.target.value)}
async function runGenerate(){const n=S.genN,focus=(S.genFocus||'').trim();const btn=$('#genGo');if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> Generating your set…'}
  const pal=PALETTE.map(([c,nm])=>`${c}=${nm}`).join(', ');
  try{const r=await ai(JSYS+`Create a set of ${n} topic tabs for marking up a paper Bible with highlighters${focus&&focus!=='General'?`, focused on: ${focus}`:''}. Give each topic one highlighter color from this palette: ${pal}. Use a different color for each topic where possible${n>PALETTE.length?' (reuse colors for related topics if needed)':''}. Keep each "why" very short.\nReturn JSON: {"name": "short set name (2-4 words)", "topics": [{"name": "1-3 words", "emoji": "one emoji", "color": "palette letter", "meaning": "what this color marks, max 10 words", "verses": [{"ref": "Book chapter:verse (full book name)", "why": "max 12 words"}]}]} with exactly ${n} topics and exactly 5 well-known verses per topic, each true to its context.`,null,null,'default');
    const d=parseJSON(r.text);const id='g'+newId();
    const topics=(d.topics||[]).slice(0,25).map(t=>({id:'t'+newId(),emoji:t.emoji||'🏷️',name:String(t.name||'Topic').slice(0,40),color:okColor(t.color),meaning:t.meaning||'',verses:(t.verses||[]).map(v=>({ref:normRef(v.ref),why:v.why||''})).filter(v=>v.ref).slice(0,5)}));
    if(!topics.length)throw {message:'No topics came back — try again.'};
    Store.set('s_'+id,{name:String(d.name||'New set').slice(0,40),focus,at:Date.now(),topics});S.keySet=id;closeSheet();renderView();toast('New set ready ✨')}
  catch(e){const m=$('#genMsg');if(m)m.textContent=aiErr(e);if(btn){btn.disabled=false;btn.textContent='✨ Try again'}}}
async function refreshTopic(tid){const sid=S.keySet;const s=getSet(sid);const t=findTopic(s,tid);if(!t)return;const isMain=sid==='main';
  const main=mainSet();const mt=main.topics.find(x=>sameName(x.name,t.name));
  const exclude=[...new Set([...(t.seen||[]),...(t.verses||[]).map(v=>v.ref),...((t.suggest||[]).map(v=>v.ref)),...(mt?mt.verses.map(v=>v.ref):[])])].map(codeToLabel);
  S.keyBusy=sid+'|'+tid;S.openTopic=sid+'|'+tid;renderView();
  try{const r=await ai(JSYS+`Give 5 different Bible verses for the topic "${t.name}"${t.meaning?` (${t.meaning})`:''}. Do NOT use any of these: ${exclude.join('; ')||'none'}. Pick verses that truly fit the topic in their context, from across the Bible.\nReturn JSON: {"verses": [{"ref": "Book chapter:verse (full book name)", "why": "max 12 words"}]}`,null,null,'default');
    const d=parseJSON(r.text);const ex=new Set(exclude.map(x=>normRef(x)));
    const fresh=(d.verses||[]).map(v=>({ref:normRef(v.ref),why:v.why||''})).filter(v=>v.ref&&!ex.has(v.ref)).slice(0,5);
    if(!fresh.length)throw {message:'No new verses came back — try again.'};
    updateSet(sid,x=>{const tt=findTopic(x,tid);tt.seen=[...new Set([...(tt.seen||[]),...(tt.verses||[]).map(v=>v.ref),...((tt.suggest||[]).map(v=>v.ref))])].slice(-150);
      if(isMain)tt.suggest=fresh;else tt.verses=fresh});
    toast(isMain?'New suggestions ✨':'Fresh verses 🔄')}
  catch(e){toast(aiErr(e))}
  S.keyBusy=null;renderView()}

Object.assign(A,{
  keySet:el=>{S.keySet=el.dataset.s;S.openTopic=null;renderView()},
  keyGenerate:()=>genSheet(),
  genStep:el=>{S.genN=Math.max(2,Math.min(25,(S.genN||6)+(+el.dataset.d)));$('#genN').textContent=S.genN;$('#genGo').textContent=`✨ Generate ${S.genN} topics`},
  genFocusPick:el=>{S.genFocus=el.dataset.f;$('#genFocus').value=el.dataset.f},
  genGo:()=>runGenerate(),
  keyAddTopic:()=>topicSheet(null),
  keyEditTopic:el=>topicSheet(el.dataset.t),
  keyPickColor:el=>{S._tColor=el.dataset.c;$$('.pal').forEach(b=>b.classList.toggle('on',b.dataset.c===el.dataset.c));const lab=$('#tkWheelLab');if(lab)lab.style.removeProperty('--pick')},
  keySaveTopicForm:el=>{const name=$('#tkName').value.trim();if(!name){toast('Give the topic a name');return}const tid=el.dataset.t;
    const data={name,meaning:$('#tkMeaning').value.trim(),emoji:$('#tkEmoji').value.trim()||'🏷️',color:okColor(S._tColor)};
    updateSet(S.keySet,s=>{if(tid)Object.assign(findTopic(s,tid),data);else{const t=Object.assign({id:'t'+newId(),verses:[]},data);s.topics.push(t);S.openTopic=S.keySet+'|'+t.id}});closeSheet();renderView()},
  keyDelTopic:el=>{const t=findTopic(getSet(S.keySet),el.dataset.t);confirmSheet(`Delete “${t.name}” and its ${(t.verses||[]).length} verses?`,'Delete',()=>{updateSet(S.keySet,s=>{s.topics=s.topics.filter(x=>x.id!==el.dataset.t)});toast('Topic deleted')})},
  keyAddVerse:el=>{const tid=el.dataset.t;const inp=$('#kadd_'+tid);const r=normRef(inp.value);if(!r){toast('Try a reference like "Psalm 27:1"');return}
    S.openTopic=S.keySet+'|'+tid;updateSet(S.keySet,s=>{const t=findTopic(s,tid);if(!t.verses.some(v=>v.ref===r))t.verses.push({ref:r,why:''})});toast('Verse added')},
  keyDelVerse:el=>{S.openTopic=S.keySet+'|'+el.dataset.t;updateSet(S.keySet,s=>{const t=findTopic(s,el.dataset.t);t.verses.splice(+el.dataset.i,1)})},
  keyAddSugg:el=>{S.openTopic=S.keySet+'|'+el.dataset.t;updateSet(S.keySet,s=>{const t=findTopic(s,el.dataset.t);const v=t.suggest.splice(+el.dataset.i,1)[0];if(v&&!t.verses.some(x=>x.ref===v.ref))t.verses.push(v)});toast('Added ⭐ to your main key (Bible Kit › Tabs › Topics)')},
  keySaveVerse:el=>{const t=findTopic(getSet(S.keySet),el.dataset.t);saveVerseToMain(t,t.verses[+el.dataset.i])},
  keySaveTopic:el=>{const t=findTopic(getSet(S.keySet),el.dataset.t);let added=0;updateSet('main',m=>{let mt=m.topics.find(x=>sameName(x.name,t.name));
      if(!mt){mt={id:'t'+newId(),emoji:t.emoji,name:t.name,color:t.color,meaning:t.meaning||'',verses:[]};m.topics.push(mt)}
      t.verses.forEach(v=>{if(!mt.verses.some(x=>x.ref===v.ref)){mt.verses.push({ref:v.ref,why:v.why||''});added++}})});
    toast(`⭐ “${t.name}” saved to your main key (${added} new verse${added===1?'':'s'})`)},
  keyRefresh:el=>refreshTopic(el.dataset.t),
  keyUseMain:el=>{const id=(el&&el.dataset&&el.dataset.s)||S.keySet;const sn=getSet(id);if(!sn||id==='main')return;const old=mainSet();
    confirmSheet(`Make “${sn.name}” your main key ⭐? It will be used for Load, highlights and everything else. “${old.name}” moves to the other tabs, so nothing is lost.`,'⭐ Make it my main key',()=>{
      Store.set('s_g'+newId(),{name:old.name==='My main key'?'Previous main key':old.name,at:Date.now(),topics:JSON.parse(JSON.stringify(old.topics||[]))});
      Store.set(mainKey(),{name:sn.name,main:true,topics:JSON.parse(JSON.stringify(sn.topics||[]))});
      if(id!=='starter')Store.del('s_'+id);S.keySet='main';closeSheet();renderView();toast(`“${sn.name}” is now your main key ⭐`)})},
  keyRename:()=>{const s=getSet(S.keySet);openSheet(`<h3>Rename set</h3><input class="f" id="setName" value="${esc(s.name)}" maxlength="40"><div class="row" style="margin-top:12px"><button class="btn pri grow" data-act="keyRenameGo">Save</button></div>`)},
  keyRenameGo:()=>{const n=$('#setName').value.trim();if(!n)return;updateSet(S.keySet,s=>{s.name=n});closeSheet();renderView()},
  keyDelSet:()=>A.keyDelSetId({dataset:{s:S.keySet}}),
  keyDelSetId:el=>{const id=el.dataset.s;const s=getSet(id);if(!s||id==='main')return;confirmSheet(`Delete the tab “${s.name}”? Anything you saved to your main key stays.`,'Delete tab',()=>{if(id==='starter')Store.set('s_starter',{deleted:true,name:'Starter topics',topics:[]});else Store.del('s_'+id);if(S.keySet===id)S.keySet='main';renderView();toast('Tab deleted')})},

async function api(path,opts={}){const r=await fetch(path,Object.assign({},opts,{headers:Object.assign({'Content-Type':'application/json','X-Code':Code.value||''},opts.headers||{})}));

const b64u={enc:u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')},
  dec:str=>{str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const b=atob(str);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}};
async function gzip(text){const cs=new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));return new Uint8Array(await new Response(cs).arrayBuffer())}
async function gunzip(u8){const ds=new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(ds).text()}
async function buildSyncLink(){const items={};for(const [k,v] of Store.items)if(isItemKey(k))items[k]=v;
  let packed=b64u.enc(await gzip(JSON.stringify({app:'loadedbible',v:1,items})));let dropped=false;
  if(packed.length>700000){delete items.pic_banner;delete items.pic_avatar;dropped=true;packed=b64u.enc(await gzip(JSON.stringify({app:'loadedbible',v:1,items})))}
  return {url:SITE_URL+'/#lbsync='+packed,n:Object.keys(items).length,dropped}}
async function showSyncPrompt(){const raw=S.pendingSync;if(!raw)return;let d;try{d=JSON.parse(await gunzip(b64u.dec(raw)))}catch(e){S.pendingSync=null;toast('That link from the Claude app didn’t work — try sending again.');return}
  if(!d||d.app!=='loadedbible'||!d.items){S.pendingSync=null;return}const n=Object.keys(d.items).filter(isItemKey).length;S._syncData=d;
  openSheet(`<div style="text-align:center"><div style="font-size:40px">📲</div><h3>Load your Claude progress?</h3><p>Add <b>${n} items</b> from the Claude app to <b>${esc(Code.value||'')}</b>?</p><p class="small muted">Items with the same name are replaced with the Claude version. Everything else stays.</p></div>
    <div class="row"><button class="btn pri grow" data-act="syncYes">✅ Yes, load it</button><button class="btn grow" data-act="syncNo">Not now</button></div>`)}

  syncYes:()=>{const d=S._syncData;let n=0;Object.entries(d.items).forEach(([k,v])=>{if(isItemKey(k)){Store.set(k,v);n++}});S.pendingSync=null;S._syncData=null;closeSheet();applyTheme();updateAvatar();renderView();toast(`Loaded ${n} items from the Claude app 🎉`)},
  syncNo:()=>{S.pendingSync=null;S._syncData=null;closeSheet()},
});
